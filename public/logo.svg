    <circle cx="256" cy="256" r="150" fill="url(#cf-glow)"/>
    <circle cx="256" cy="256" r="196" fill="none" stroke="#F5F3EF" stroke-opacity="0.5" stroke-width="6"/>
    <g fill="#F5F3EF" fill-opacity="0.5">
