      <circle cx="60" cy="256" r="6"/><circle cx="452" cy="256" r="6"/>
    </g>
    <path d="M256 104 L290 222 L408 256 L290 290 L256 408 L222 290 L104 256 L222 222 Z" fill="#F7F5F1"/>
    <circle cx="256" cy="256" r="21" fill="#F7F5F1"/>
