<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!-- 塔罗牌背（PRD-TAROT-V2 P0-A）：墨色纸面雕版风 —— 纸底 + 墨色细线星月罗盘，遵循 DESIGN-SYSTEM「Ink on Paper」 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF9F6"/>
      <stop offset="1" stop-color="#F3EFE7"/>
    </linearGradient>
    <pattern id="lattice" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 9 H18 M9 0 V18" stroke="#1C1A16" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="200" height="300" rx="12" fill="url(#bg)"/>
  <rect width="200" height="300" rx="12" fill="url(#lattice)"/>

  <!-- 双细线边框（墨色） -->
  <rect x="7" y="7" width="186" height="286" rx="9" fill="none" stroke="#1C1A16" stroke-width="1.1" opacity="0.55"/>
  <rect x="12" y="12" width="176" height="276" rx="7" fill="none" stroke="#1C1A16" stroke-width="0.6" opacity="0.28"/>

  <!-- 中央星月罗盘母题（品牌细线装饰语言） -->
  <g transform="translate(100 150)" stroke="#1C1A16" fill="none">
    <circle r="52" stroke-width="0.9" opacity="0.5"/>
    <circle r="44" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 4"/>
    <circle r="26" stroke-width="0.7" opacity="0.45"/>
    <!-- 24 刻度 -->
    <g opacity="0.45">
      <g id="tick"><line x1="0" y1="-52" x2="0" y2="-47" stroke-width="0.8"/></g>
      <use href="#tick" transform="rotate(15)"/><use href="#tick" transform="rotate(30)"/>
      <use href="#tick" transform="rotate(45)"/><use href="#tick" transform="rotate(60)"/>
      <use href="#tick" transform="rotate(75)"/><use href="#tick" transform="rotate(90)"/>
      <use href="#tick" transform="rotate(105)"/><use href="#tick" transform="rotate(120)"/>
      <use href="#tick" transform="rotate(135)"/><use href="#tick" transform="rotate(150)"/>
      <use href="#tick" transform="rotate(165)"/><use href="#tick" transform="rotate(180)"/>
      <use href="#tick" transform="rotate(195)"/><use href="#tick" transform="rotate(210)"/>
      <use href="#tick" transform="rotate(225)"/><use href="#tick" transform="rotate(240)"/>
      <use href="#tick" transform="rotate(255)"/><use href="#tick" transform="rotate(270)"/>
      <use href="#tick" transform="rotate(285)"/><use href="#tick" transform="rotate(300)"/>
      <use href="#tick" transform="rotate(315)"/><use href="#tick" transform="rotate(330)"/>
      <use href="#tick" transform="rotate(345)"/>
    </g>
    <!-- 新月（墨色实心） -->
    <path d="M8 -12 A15 15 0 1 0 8 12 A11.5 11.5 0 1 1 8 -12 Z" fill="#1C1A16" opacity="0.72" stroke="none"/>
    <!-- 点缀小星（金色微点，语义色中性提示，极小面积） -->
    <g stroke="none">
      <path d="M0 0 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6 Z" transform="translate(-16 -32)" fill="#1C1A16" opacity="0.6"/>
      <circle cx="34" cy="-20" r="1.3" fill="#B0870F" opacity="0.75"/>
      <circle cx="-34" cy="22" r="1" fill="#1C1A16" opacity="0.5"/>
      <circle cx="20" cy="34" r="1.1" fill="#B0870F" opacity="0.6"/>
    </g>
  </g>

  <!-- 上下弧线角饰 -->
  <g stroke="#1C1A16" fill="none" stroke-width="0.7" opacity="0.4">
    <path d="M24 30 Q100 18 176 30"/>
    <path d="M24 270 Q100 282 176 270"/>
  </g>
</svg>
