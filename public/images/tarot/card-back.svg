<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!-- 塔罗牌背（PRD-TAROT-V2 P0-A）：深靛底 + 细线纹样，模块色系 #4338CA -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <pattern id="lattice" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 10 H20 M10 0 V20" stroke="#E0E7FF" stroke-width="0.5" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="200" height="300" rx="12" fill="url(#bg)"/>
  <rect width="200" height="300" rx="12" fill="url(#lattice)"/>

  <!-- 双细线边框 -->
  <rect x="7" y="7" width="186" height="286" rx="9" fill="none" stroke="#E0E7FF" stroke-width="1.2" opacity="0.7"/>
  <rect x="12" y="12" width="176" height="276" rx="7" fill="none" stroke="#E0E7FF" stroke-width="0.6" opacity="0.4"/>

  <!-- 中央星月罗盘母题 -->
  <g transform="translate(100 150)" stroke="#E0E7FF" fill="none">
    <circle r="52" stroke-width="0.8" opacity="0.55"/>
    <circle r="44" stroke-width="0.5" opacity="0.35" stroke-dasharray="2 4"/>
    <circle r="26" stroke-width="0.7" opacity="0.5"/>
    <!-- 24 刻度 -->
    <g opacity="0.5">
      <g id="tick"><line x1="0" y1="-52" x2="0" y2="-47" stroke-width="0.8"/></g>
      <use href="#tick" transform="rotate(15)"/><use href="#tick" transform="rotate(30)"/>
      <use href="#tick" transform="rotate(45)"/><use href="#tick" transform="rotate(60)"/>
      <use href="#tick" transform="rotate(75)"/><use href="#tick" transform="rotate(90)"/>
      <use href="#tick" transform="rotate(105)"/><use href="#tick" transform="rotate(120)"/>
      <use href="#tick" transform="rotate(135)"/><use href="#tick" transform="rotate(150)"/>
      <use href="#tick" transform="rotate(165)"/><use href="#tick" transform="rotate(180)"/>
      <use href="#tick" transform="rotate(195)"/><use href="#tick" transform="rotate(210)"/>
      <use href="#tick" transform="rotate(225)"/><use href="#tick" transform="rotate(240)"/>
      <use href="#tick" transform="rotate(255)"/><use href="#tick" transform="rotate(270)"/>
      <use href="#tick" transform="rotate(285)"/><use href="#tick" transform="rotate(300)"/>
      <use href="#tick" transform="rotate(315)"/><use href="#tick" transform="rotate(330)"/>
      <use href="#tick" transform="rotate(345)"/>
    </g>
    <!-- 新月 -->
    <path d="M8 -12 A15 15 0 1 0 8 12 A11.5 11.5 0 1 1 8 -12 Z" fill="#E0E7FF" opacity="0.85" stroke="none"/>
    <!-- 四角小星 -->
    <g fill="#E0E7FF" stroke="none" opacity="0.8">
      <path d="M0 -36 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6 Z" transform="translate(-16 8)" opacity="0.9"/>
      <circle cx="34" cy="-20" r="1.4"/>
      <circle cx="-34" cy="22" r="1.1"/>
      <circle cx="20" cy="34" r="1.2"/>
    </g>
  </g>

  <!-- 上下角饰 -->
  <g stroke="#E0E7FF" fill="none" stroke-width="0.7" opacity="0.5">
    <path d="M24 30 Q100 18 176 30"/>
    <path d="M24 270 Q100 282 176 270"/>
  </g>
</svg>
